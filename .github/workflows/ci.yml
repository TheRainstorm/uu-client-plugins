name: Independent UU plugin
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: plugin-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: plugin-source
          persist-credentials: false
      - name: Read pinned engine SDK
        id: sdk
        run: |
          python3 - <<'PY'
          import json,os,re
          pin=json.load(open('plugin-source/engine-sdk.json'))
          assert re.fullmatch('[0-9a-f]{40}',pin['revision'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('revision='+pin['revision']+'\n')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TheRainstorm/eclipse
          ref: ${{ steps.sdk.outputs.revision }}
          path: engine
          persist-credentials: false
      - name: Set up independent workspace
        run: |
          mv plugin-source engine/plugins
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config cmake nasm libasound2-dev libpulse-dev libwayland-dev libxkbcommon-dev libpipewire-0.3-dev libclang-dev gcc-mingw-w64-x86-64-win32 g++-mingw-w64-x86-64-win32 binutils-mingw-w64-x86-64
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-win32
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-win32
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
          rustup default 1.95.0
          rustup target add x86_64-pc-windows-gnu
      - name: Test generated media, input, defaults and lifecycle
        working-directory: engine/plugins
        run: cargo test --release --locked -p uu-compat --tests
      - name: Load the actual plugin against the application SDK
        working-directory: engine/plugins
        run: python3 tools/package.py --target x86_64-unknown-linux-gnu --validate-only
      - name: Package the Windows plugin only
        working-directory: engine/plugins
        run: python3 tools/package.py --target x86_64-pc-windows-gnu
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eclipse-plugin-uu-windows-x64
          path: engine/plugins/artifacts/*.zip
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: eclipse-plugin-uu-windows-x64
          path: artifacts
      - name: Publish independent plugin release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PLUGIN_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$PLUGIN_TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/plugin-release-state" 2>/dev/null; then
            test "$(cat "$RUNNER_TEMP/plugin-release-state")" = false
            mkdir existing
            gh release download "$PLUGIN_TAG" --pattern "*-${GITHUB_SHA:0:12}.zip" --dir existing
            python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          current=list(pathlib.Path('artifacts').glob('*.zip'))
          published=list(pathlib.Path('existing').glob('*.zip'))
          assert len(current)==len(published)==1 and current[0].name==published[0].name
          with zipfile.ZipFile(current[0]) as a,zipfile.ZipFile(published[0]) as b:
              assert len(a.namelist())==len(b.namelist()) and set(a.namelist())==set(b.namelist())
              expected=json.loads(a.read('plugins/uu/plugin.json'));actual=json.loads(b.read('plugins/uu/plugin.json'))
              for key in ['api_version','sdk_id','id','version','library','data_files']:assert actual[key]==expected[key]
              assert hashlib.sha256(b.read('plugins/uu/'+actual['library'])).hexdigest()==actual['library_sha256']
              assert b.testzip() is None
          PY
            echo 'Published plugin matches the tag and SDK; retaining immutable assets.'
            exit 0
          fi
          gh release create "$PLUGIN_TAG" --verify-tag artifacts/*.zip --title "$PLUGIN_TAG" --notes 'Optional UU plugin. Install the matching main application separately; extract at its directory and enable manually.'
