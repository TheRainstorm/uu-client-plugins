name: Plugin compatibility
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: plugins-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TheRainstorm/uu-client
          ref: 7e723ac5aa606df4de200b4aaa355223554df755
          path: engine
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: engine/plugins
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config cmake nasm libasound2-dev libpulse-dev
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
          rustup default 1.95.0
      - name: Validate plugin against the pinned SDK
        working-directory: engine
        run: cargo test --release -p uu-compat --lib --locked
